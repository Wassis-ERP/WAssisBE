version: "3.9"

services:
  postgres:
    image: postgres:16.10-bookworm@sha256:38471f330eb885e04de130b768d6db4e10469e2311879c7e5c699f6d2d8a1c74
    container_name: wassis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${WASSIS_POSTGRES_DB:-wassis}
      POSTGRES_USER: ${WASSIS_POSTGRES_USER:?configure WASSIS_POSTGRES_USER in an untracked .env file}
      POSTGRES_PASSWORD: ${WASSIS_POSTGRES_PASSWORD:?configure WASSIS_POSTGRES_PASSWORD in an untracked .env file}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4.1.4-management-alpine@sha256:5cbd7145b0306399ad68422c3350b6cbd1bb95704b39f5896480e5b6d4238a04
    container_name: wassis-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${WASSIS_RABBITMQ_USER:?configure WASSIS_RABBITMQ_USER in an untracked .env file}
      RABBITMQ_DEFAULT_PASS: ${WASSIS_RABBITMQ_PASSWORD:?configure WASSIS_RABBITMQ_PASSWORD in an untracked .env file}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

  redis:
    image: redis:8.2.1-alpine@sha256:987c376c727652f99625c7d205a1cba3cb2c53b92b0b62aade2bd48ee1593232
    container_name: wassis-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${WASSIS_REDIS_PASSWORD:?configure WASSIS_REDIS_PASSWORD in an untracked .env file}
    command: ["sh", "-c", "exec redis-server --appendonly yes --bind 0.0.0.0 --protected-mode yes --requirepass \"$$REDIS_PASSWORD\""]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  rabbitmq_data:
  redis_data:
