name: PR Validation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/packages.lock.json

      - name: Restore
        run: dotnet restore WAssisInsurance.sln

      - name: Build
        run: dotnet build WAssisInsurance.sln --configuration Release --no-restore -p:UseSharedCompilation=false -nodeReuse:false

      - name: Test
        run: dotnet test WAssisInsurance.sln --configuration Release --no-build -p:UseSharedCompilation=false -nodeReuse:false

      - name: Vulnerable package audit
        run: dotnet list WAssisInsurance.sln package --vulnerable --include-transitive

      - name: Publish API
        run: dotnet publish src/WAssis.Services.Api/WAssis.Services.Api.csproj --configuration Release --no-build --output ./artifacts/api -p:UseAppHost=false

      - name: Upload API artifact
        uses: actions/upload-artifact@v4
        with:
          name: wassisbe-api
          path: ./artifacts/api
