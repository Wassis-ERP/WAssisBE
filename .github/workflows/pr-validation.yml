name: PR Validation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/packages.lock.json

      - name: Restore API
        run: dotnet restore src/WAssis.Services.Api/WAssis.Services.Api.csproj

      - name: Restore tests
        run: dotnet restore tests/WAssis.Tests/WAssis.Tests.csproj

      - name: Build API
        run: dotnet build src/WAssis.Services.Api/WAssis.Services.Api.csproj --configuration Release --no-restore -p:UseSharedCompilation=false -nodeReuse:false

      - name: Test
        run: dotnet test tests/WAssis.Tests/WAssis.Tests.csproj --configuration Release --no-restore -p:UseSharedCompilation=false -nodeReuse:false

      - name: Vulnerable package audit
        run: dotnet list src/WAssis.Services.Api/WAssis.Services.Api.csproj package --vulnerable --include-transitive

      - name: Publish API
        run: dotnet publish src/WAssis.Services.Api/WAssis.Services.Api.csproj --configuration Release --no-build --output ./artifacts/api -p:UseAppHost=false

      - name: Build API Docker image
        run: docker build -t wassisbe-api:${{ github.sha }} .

      - name: Scan API image
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: wassisbe-api:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Upload API artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wassisbe-api
          path: ./artifacts/api
