name: PR Validation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - codex/security-remediation-followup
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Secret scan (history included)
        shell: pwsh
        run: |
          $scanner = ./scripts/install-gitleaks.ps1
          & $scanner git --redact=100 --log-opts='--all' --no-banner .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/test-secret-hook.ps1 -GitleaksPath $scanner
          exit $LASTEXITCODE

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.401
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/packages.lock.json

      - name: Restore locked dependencies
        run: dotnet restore WAssisInsurance.sln --locked-mode

      - name: Build API
        run: dotnet build src/WAssis.Services.Api/WAssis.Services.Api.csproj --configuration Release --no-restore -p:UseSharedCompilation=false -nodeReuse:false

      - name: Test
        run: dotnet test tests/WAssis.Tests/WAssis.Tests.csproj --configuration Release --no-restore -p:UseSharedCompilation=false -nodeReuse:false

      - name: Vulnerability report (restore enforces audit errors)
        run: dotnet list WAssisInsurance.sln package --vulnerable --include-transitive

      - name: Publish API
        run: dotnet publish src/WAssis.Services.Api/WAssis.Services.Api.csproj --configuration Release --no-build --output ./artifacts/api -p:UseAppHost=false

      - name: Publish Worker
        run: dotnet publish src/WAssis.BackgroundTasks/WAssis.BackgroundTasks.csproj --configuration Release --no-build --output ./artifacts/worker -p:UseAppHost=false

      - name: Build API Docker image
        run: docker build -t wassisbe-api:${{ github.sha }} .

      - name: Scan API image
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: wassisbe-api:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Build Worker Docker image
        run: docker build -f Dockerfile.worker -t wassisbe-worker:${{ github.sha }} .

      - name: Scan Worker image
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: wassisbe-worker:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Upload API artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wassisbe-api
          path: ./artifacts/api

      - name: Upload Worker artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wassisbe-worker
          path: ./artifacts/worker
