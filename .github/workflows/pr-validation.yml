name: PR Validation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/packages.lock.json

      - name: Restore
        run: dotnet restore WAssisInsurance.sln

      - name: Build
        run: dotnet build WAssisInsurance.sln --configuration Release --no-restore -p:UseSharedCompilation=false -nodeReuse:false

      - name: Test
        run: dotnet test WAssisInsurance.sln --configuration Release --no-build -p:UseSharedCompilation=false -nodeReuse:false
