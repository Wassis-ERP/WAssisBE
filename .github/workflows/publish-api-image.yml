name: Publish API Image

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "hml"
        type: choice
        options:
          - hml
          - prod

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/wassis-erp/wassisbe-api

jobs:
  publish:
    name: Build, Push and Redeploy API Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tag
        id: meta
        env:
          HML_WEBHOOK_URL: ${{ secrets.PORTAINER_API_HML_WEBHOOK_URL }}
          PROD_WEBHOOK_URL: ${{ secrets.PORTAINER_API_PROD_WEBHOOK_URL }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.environment }}" = "prod" ]; then
              echo "tag=latest" >> "$GITHUB_OUTPUT"
              echo "webhook_url=${PROD_WEBHOOK_URL}" >> "$GITHUB_OUTPUT"
            else
              echo "tag=hml" >> "$GITHUB_OUTPUT"
              echo "webhook_url=${HML_WEBHOOK_URL}" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "tag=hml" >> "$GITHUB_OUTPUT"
            echo "webhook_url=${HML_WEBHOOK_URL}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Trigger Portainer redeploy
        if: steps.meta.outputs.webhook_url != ''
        run: curl -fsSL -X POST "${{ steps.meta.outputs.webhook_url }}"
