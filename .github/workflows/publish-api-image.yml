name: Publish API Image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Container image tag"
        required: true
        default: "hml"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build and Push API Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/wassis-erp/wassisbe-api:${{ inputs.tag }}
            ghcr.io/wassis-erp/wassisbe-api:${{ github.sha }}
