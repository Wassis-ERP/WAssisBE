name: Publish API Image

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "hml"
        type: choice
        options:
          - hml
          - prod

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/wassis-erp/wassisbe-api
  HML_API_BASE_URL: https://api20-hml.wassis.com.br
  PROD_API_BASE_URL: https://api20.wassis.com.br

jobs:
  publish:
    name: Build and Push API Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set image tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.environment }}" = "prod" ]; then
              echo "tag=latest" >> "$GITHUB_OUTPUT"
              echo "health_url=${PROD_API_BASE_URL}/health/ready" >> "$GITHUB_OUTPUT"
            else
              echo "tag=hml" >> "$GITHUB_OUTPUT"
              echo "health_url=${HML_API_BASE_URL}/health/ready" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "tag=hml" >> "$GITHUB_OUTPUT"
            echo "health_url=${{ env.HML_API_BASE_URL }}/health/ready" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          sbom: true
          provenance: mode=max
          build-args: |
            BUILD_SHA=${{ github.sha }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Deployment handoff
        env:
          RELEASE_IMAGE: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
        run: |
          echo "Image published: $RELEASE_IMAGE" >> "$GITHUB_STEP_SUMMARY"
          echo "Rollout requires the authorized manager gate in scripts/release-swarm.sh: migration singleton, schema validation, API update and readiness." >> "$GITHUB_STEP_SUMMARY"
          echo "The old service webhook cannot prove migration completion and is deliberately not invoked." >> "$GITHUB_STEP_SUMMARY"
